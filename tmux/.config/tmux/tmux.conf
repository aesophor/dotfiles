# Default terminal
set -g default-terminal "tmux-256color"

# Use vim key bindings
set -g mode-keys vi
set -g status-keys vi

# Turn the mouse on
set -g mouse on

# Time in milliseconds for which tmux waits after an escape
set -g escape-time 0

# Enable supported focus events
set -g focus-events on

# History settings
set -g history-limit 10000
set -g history-file ~/.config/tmux/tmuxhistory

# Activity
set -g monitor-activity on
set -g visual-activity off

# Start window index at 1
set -g base-index 1

# Start pane index at 1
set -g pane-base-index 1

# Rename window to reflect current program
set -g -w automatic-rename on

# Renumber windows when one is closed
set -g renumber-windows on

# No bells at all
set -g bell-action none

# Enable RGB color if running in xterm
#set -g -a terminal-overrides ",xterm-256color:Tc"

# Unbind default prefix key
unbind-key C-b

# Set default prefix key
set -g prefix C-a

# Switch between inner and outer tmux.
bind -T root C-q set prefix None \; set key-table off \; refresh-client -S
bind -T off C-q set prefix C-a \; set key-table root \; refresh-client -S

# Bind "C-a C-a" to send "C-a"
bind-key C-a send-prefix

# Reload configuration
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# Switch panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Switch windows
unbind-key n
bind-key p previous-window
bind-key n next-window
bind-key 1 select-window -t:1
bind-key 2 select-window -t:2
bind-key 3 select-window -t:3
bind-key 4 select-window -t:4
bind-key 5 select-window -t:5
bind-key 6 select-window -t:6
bind-key 7 select-window -t:7
bind-key 8 select-window -t:8
bind-key 9 select-window -t:9
bind-key 0 select-window -t:10

# Split pane with same directory
unbind-key '"'
unbind-key '%'
bind-key '-' split-window -v -c "#{pane_current_path}"
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key '_' split-window -fv -c "#{pane_current_path}"
bind-key '|' split-window -fh -c "#{pane_current_path}"

# Resize panes
bind-key -n M-H resize-pane -L 2
bind-key -n M-J resize-pane -D 1
bind-key -n M-K resize-pane -U 1
bind-key -n M-L resize-pane -R 2

# Toggle zoom
bind-key -n M-z resize-pane -Z

# Move panes
unbind-key '{'
unbind-key '}'
#bind-key -r H swap-pane -U
#bind-key -r L swap-pane -D

# Kill pane
bind-key x kill-pane

# Swap windows across themselves
bind-key -r '<' swap-window -t -1
bind-key -r '>' swap-window -t +1

# Kill window
unbind-key '&'
bind-key X kill-window
#bind-key K kill-window -a

# Enter copy mode
bind-key -n M-v copy-mode

# Select
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Make mouse drag end behavior configurable
unbind-key -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -t '{mouse}' -X clear-selection \; send-keys -t '{mouse}' -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -t '{mouse}' -X clear-selection \; send-keys -t '{mouse}' -X -N 5 scroll-down

# Jump search mode with prefix
bind-key '/' copy-mode \; send-keys "/"
bind-key '?' copy-mode \; send-keys "?"

# Mode
set -g mode-style bg=brightblack,fg=default

# Status position
set -g status-position top

# Status update interval
set -g status-interval 5

# Basic status bar colors
set -g status-style bg=default,fg=white

# Left side of status bar
set -g status-left-length 40
set -g status-left '#{?#{==:#{key-table},off},#[fg=colour240],#[fg=default]}[#S]#[default] '

# Window status
set -g window-status-separator " "
set -g status-justify left

# Right side of status bar
set -g status-right-length 40

# Clock mode
set -g clock-mode-colour white
set -g clock-mode-style 24

set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/plugins/tpm/tpm'

# Theme
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_number_color "#{@thm_blue}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,  ,}"
set -g @catppuccin_window_number_position "left"
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# Add some space between the status bar and the prompt
set -g status 2
set -g 'status-format[1]' '#[bg=default] '
